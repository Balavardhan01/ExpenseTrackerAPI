spring.application.name=ExpenseTrackerAPI

# ===============================
# Database Connection Settings
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/expense
spring.datasource.username=postgres
spring.datasource.password=pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate Settings
# ===============================
# Automatically create or update the database schema based on your Entity classes
spring.jpa.hibernate.ddl-auto=update

# Specify the PostgreSQL dialect so Hibernate generates optimized SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Print executed SQL queries to the console (helpful for debugging)
spring.jpa.show-sql=true
